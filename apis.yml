aid: ubiq
name: Ubiq (now NECTURE)
description: Ubiq is a Vienna, Austria mobility-intelligence company (NECTURE GmbH)
  that rebranded from UBIQ to NECTURE in 2024. Its "distributed operations" SaaS
  platform turns fleet data into action for shared-mobility operators, business
  fleets transitioning to EVs, autonomous fleets, and last-mile delivery -- offering
  automated rebalancing, predictive charging (Charging as a Service), and airport
  peak services, alongside StreetCrowd, its decentralized community workforce for
  fleet operations. Founded in 2015 around city parking optimization, it pivoted
  to shared-mobility SaaS in 2020 and is backed by Speedinvest among other investors.
  No public developer portal, API documentation, or client packages were found.
